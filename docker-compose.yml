version: '3.9'

services:
  db:
    image: postgres:16
    container_name: laba4_db_1
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # Изменил порт, чтобы не конфликтовать с локальным PostgreSQL
    restart: unless-stopped
    networks:
      - app_network

  api:
    build: .
    container_name: laba4_api_1
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/audit_db
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge